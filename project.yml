# XcodeGen spec: `xcodegen generate` writes EV6Precondition.xcodeproj (not committed).
# Codemagic runs it on every build; run it yourself if you open the project in Xcode.
name: EV6Precondition
options:
  bundleIdPrefix: com.luciusgee
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  PreconditionKit:
    path: PreconditionKit
targets:
  EV6Precondition:
    type: application
    platform: iOS
    sources:
      - path: EV6Precondition
    dependencies:
      - package: PreconditionKit
    info:
      path: EV6Precondition/Info.plist
      properties:
        # Black, so the launch animation starts without a white flash.
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luciusgee.ev6precondition
        PRODUCT_NAME: EV6Precondition
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: EV6Precondition/EV6Precondition.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Volt Lab
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_UIFileSharingEnabled: "YES"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Connects to your OBD adapter to read live data, battery health, trouble codes and speed for performance timing straight from the car.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connects to a Wi-Fi OBD adapter plugged into your car.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: The lap timer uses GPS to know when you cross your start/finish line. Your location stays on your iPhone.
        INFOPLIST_KEY_NSMotionUsageDescription: Feels the moment the car pulls away, to start performance timing more precisely.
schemes:
  EV6Precondition:
    build:
      targets:
        EV6Precondition: all
    run:
      config: Debug
    archive:
      config: Release

# XcodeGen spec: `xcodegen generate` writes EV6Precondition.xcodeproj (not committed).
# Codemagic runs it on every build; run it yourself if you open the project in Xcode.
name: EV6Precondition
options:
  bundleIdPrefix: com.luciusgee
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  PreconditionKit:
    path: PreconditionKit
targets:
  EV6Precondition:
    type: application
    platform: iOS
    sources:
      - path: EV6Precondition
      - path: Shared
    dependencies:
      - package: PreconditionKit
      - target: EV6Widgets
      - target: EV6Watch
        # Where Xcode puts a Watch app: EV6Precondition.app/Watch.
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    info:
      path: EV6Precondition/Info.plist
      properties:
        # Read at run time to name the Keychain group shared with the widgets.
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        CFBundleURLTypes:
          - CFBundleURLName: com.luciusgee.ev6precondition
            CFBundleURLSchemes: [ev6]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luciusgee.ev6precondition
        PRODUCT_NAME: EV6Precondition
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: EV6Precondition/EV6Precondition.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: EV6
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_UIFileSharingEnabled: "YES"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Connects to your OBD adapter to read the battery's health, cell voltages and tyre pressures straight from the car.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connects to a Wi-Fi OBD adapter plugged into your car to read the battery's health.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: Rules that start climate when you leave or arrive somewhere need to know when you cross that place's boundary, even with the app closed. Your location stays on your iPhone.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Rules can check that your phone is near the car before starting its climate, so it doesn't run while you're somewhere else.
  # Home Screen and Lock Screen widgets. They read what the app last saw from a shared Keychain item.
  EV6Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luciusgee.ev6precondition.widgets
        PRODUCT_NAME: EV6Widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Widgets/EV6Widgets.entitlements
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: EV6
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: "YES"

  # The Watch app. It gets the car's state from the iPhone app and asks it to send commands.
  EV6Watch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luciusgee.ev6precondition.watchkitapp
        PRODUCT_NAME: EV6Watch
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: EV6
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.luciusgee.ev6precondition
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: "YES"
schemes:
  EV6Precondition:
    build:
      targets:
        EV6Precondition: all
    run:
      config: Debug
    archive:
      config: Release

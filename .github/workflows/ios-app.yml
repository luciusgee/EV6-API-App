name: iOS app

# Builds the iPhone app on a Mac for every push, so compile errors show up in readable logs.
# Codemagic does the signed TestFlight builds.
on:
  push:
    paths: ["EV6Precondition/**", "Widgets/**", "Watch/**", "WatchWidgets/**", "Shared/**", "PreconditionKit/**", "project.yml", ".github/workflows/ios-app.yml"]
  pull_request:
    paths: ["EV6Precondition/**", "Widgets/**", "Watch/**", "WatchWidgets/**", "Shared/**", "PreconditionKit/**", "project.yml", ".github/workflows/ios-app.yml"]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: PreconditionKit tests (macOS)
        run: |
          set -o pipefail
          swift test --package-path PreconditionKit 2>&1 | tail -80
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project EV6Precondition.xcodeproj \
            -scheme EV6Precondition \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

  # Codemagic builds with the newest Xcode; this runs the kit's tests with it too, with readable logs.
  kit-tests-latest-xcode:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: xcodebuild -version && swift --version
      - name: PreconditionKit tests
        run: |
          set -o pipefail
          swift test --package-path PreconditionKit 2>&1 | grep -E "error|failed|Executed|warning: unre" | head -80

# XcodeGen spec: `xcodegen generate` writes EV6Precondition.xcodeproj (not committed).
# Codemagic runs it on every build; run it yourself if you open the project in Xcode.
name: EV6Precondition
options:
  bundleIdPrefix: com.luciusgee
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  PreconditionKit:
    path: PreconditionKit
targets:
  EV6Precondition:
    type: application
    platform: iOS
    sources:
      - path: EV6Precondition
    dependencies:
      - package: PreconditionKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luciusgee.ev6precondition
        PRODUCT_NAME: EV6Precondition
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: EV6 Precondition
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Connects to your OBD adapter to read the battery's health, cell voltages and tyre pressures straight from the car.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connects to a Wi-Fi OBD adapter plugged into your car to read the battery's health.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: Rules that start climate when you leave or arrive somewhere need to know when you cross that place's boundary, even with the app closed. Your location stays on your iPhone.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Rules can check that your phone is near the car before starting its climate, so it doesn't run while you're somewhere else.
schemes:
  EV6Precondition:
    build:
      targets:
        EV6Precondition: all
    run:
      config: Debug
    archive:
      config: Release
